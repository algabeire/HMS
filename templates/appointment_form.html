{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">{% if appointment %}Edit{% else %}Add{% endif %} Appointment</h2>
    <a href="{{ url_for('appointments.list_appointments') }}" class="btn btn-outline-secondary rounded-pill px-4">
        <i class="fa-solid fa-arrow-left me-2"></i> Back
    </a>
</div>

<div class="card glass p-4">
    <form method="POST" action="{% if appointment %}{{ url_for('appointments.edit_appointment', id=appointment.id) }}{% else %}{{ url_for('appointments.add_appointment') }}{% endif %}">
        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label class="form-label fw-medium">Date</label>
                <input type="date" name="date" class="form-control" value="{{ appointment.date if appointment else '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-medium">Time</label>
                <input type="time" name="time" class="form-control" value="{{ appointment.time if appointment else '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-medium">Status</label>
                <select name="status" class="form-select">
                    <option value="scheduled" {% if appointment and appointment.status=='scheduled' %}selected{% endif %}>Scheduled</option>
                    <option value="completed" {% if appointment and appointment.status=='completed' %}selected{% endif %}>Completed</option>
                    <option value="cancelled" {% if appointment and appointment.status=='cancelled' %}selected{% endif %}>Cancelled</option>
                </select>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label fw-medium">Patient</label>
                <select name="patient_id" class="form-select" required>
                    <option value="">Select patient</option>
                    {% for p in patients %}
                    <option value="{{ p.id }}" {% if appointment and appointment.patient_id==p.id %}selected{% endif %}>{{ p.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-medium">Doctor</label>
                <select name="doctor_id" class="form-select" required>
                    <option value="">Select doctor</option>
                    {% for d in doctors %}
                    <option value="{{ d.id }}" {% if appointment and appointment.doctor_id==d.id %}selected{% endif %}>Dr. {{ d.name }} ({{ d.specialization }})</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="text-end">
            <button type="submit" class="btn btn-primary rounded-pill px-5">{% if appointment %}Update{% else %}Save{% endif %} Appointment</button>
        </div>
    </form>
</div>

{% endblock %}
