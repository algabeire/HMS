{% extends "base.html" %}

{% block auth_content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card glass p-4 fade-in">
            <div class="text-center mb-4">
                <i class="fa-solid fa-hospital-user text-primary" style="font-size: 3rem;"></i>
                <h3 class="mt-3 fw-bold text-main">Hospital Login</h3>
                <p class="text-muted">Enter admin credentials to proceed</p>
            </div>
            
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label for="username" class="form-label fw-medium">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                        <input type="text" class="form-control border-start-0 ps-0 bg-transparent" id="username" name="username" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-medium">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0 ps-0 bg-transparent" id="password" name="password" required>
                    </div>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-semibold">Sign In</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
