{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">{% if record %}Edit{% else %}Add{% endif %} Medical Record</h2>
    <a href="{{ url_for('emr.list_emr') }}" class="btn btn-outline-secondary rounded-pill px-4">
        <i class="fa-solid fa-arrow-left me-2"></i> Back
    </a>
</div>

<div class="card glass p-4">
    <form method="POST" action="{% if record %}{{ url_for('emr.edit_emr', id=record.id) }}{% else %}{{ url_for('emr.add_emr') }}{% endif %}">
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label fw-medium">Patient</label>
                <select name="patient_id" class="form-select" required>
                    <option value="">Select patient</option>
                    {% for p in patients %}
                    <option value="{{ p.id }}" {% if record and record.patient_id==p.id %}selected{% endif %}>{{ p.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-medium">Doctor</label>
                <select name="doctor_id" class="form-select" required>
                    <option value="">Select doctor</option>
                    {% for d in doctors %}
                    <option value="{{ d.id }}" {% if record and record.doctor_id==d.id %}selected{% endif %}>Dr. {{ d.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-medium">Diagnosis</label>
            <textarea name="diagnosis" class="form-control" rows="3" required>{{ record.diagnosis if record else '' }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label fw-medium">Treatment</label>
            <textarea name="treatment" class="form-control" rows="2">{{ record.treatment if record else '' }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label fw-medium">Notes</label>
            <textarea name="notes" class="form-control" rows="2">{{ record.notes if record else '' }}</textarea>
        </div>

        <div class="text-end">
            <button type="submit" class="btn btn-primary rounded-pill px-5">{% if record %}Update{% else %}Save{% endif %} Record</button>
        </div>
    </form>
</div>

{% endblock %}
