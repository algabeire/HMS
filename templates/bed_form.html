{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">{% if bed %}Edit{% else %}Add{% endif %} Bed</h2>
    <a href="{{ url_for('beds.list_beds') }}" class="btn btn-outline-secondary rounded-pill px-4">
        <i class="fa-solid fa-arrow-left me-2"></i> Back
    </a>
</div>

<div class="card glass p-4">
    <form method="POST" action="{% if bed %}{{ url_for('beds.edit_bed', id=bed.id) }}{% else %}{{ url_for('beds.add_bed') }}{% endif %}">
        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label class="form-label fw-medium">Bed Number</label>
                <input type="text" name="bed_number" class="form-control" value="{{ bed.bed_number if bed else '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-medium">Ward</label>
                <input type="text" name="ward" class="form-control" value="{{ bed.ward if bed else '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-medium">Status</label>
                <select name="status" class="form-select">
                    <option value="available" {% if bed and bed.status=='available' %}selected{% endif %}>Available</option>
                    <option value="occupied" {% if bed and bed.status=='occupied' %}selected{% endif %}>Occupied</option>
                    <option value="maintenance" {% if bed and bed.status=='maintenance' %}selected{% endif %}>Maintenance</option>
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-medium">Assign Patient (optional)</label>
            <select name="patient_id" class="form-select">
                <option value="">No patient</option>
                {% for p in patients %}
                <option value="{{ p.id }}" {% if bed and bed.patient_id==p.id %}selected{% endif %}>{{ p.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="text-end">
            <button type="submit" class="btn btn-primary rounded-pill px-5">{% if bed %}Update{% else %}Save{% endif %} Bed</button>
        </div>
    </form>
</div>

{% endblock %}
