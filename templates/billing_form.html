{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">{% if bill %}Edit{% else %}Add{% endif %} Billing Record</h2>
    <a href="{{ url_for('billing.list_billing') }}" class="btn btn-outline-secondary rounded-pill px-4">
        <i class="fa-solid fa-arrow-left me-2"></i> Back
    </a>
</div>

<div class="card glass p-4">
    <form method="POST" action="{% if bill %}{{ url_for('billing.edit_billing', id=bill.id) }}{% else %}{{ url_for('billing.add_billing') }}{% endif %}">
        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label class="form-label fw-medium">Amount</label>
                <input type="number" step="0.01" name="amount" class="form-control" value="{{ bill.amount if bill else '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-medium">Status</label>
                <select name="status" class="form-select">
                    <option value="pending" {% if bill and bill.status=='pending' %}selected{% endif %}>Pending</option>
                    <option value="paid" {% if bill and bill.status=='paid' %}selected{% endif %}>Paid</option>
                    <option value="cancelled" {% if bill and bill.status=='cancelled' %}selected{% endif %}>Cancelled</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-medium">Patient</label>
                <select name="patient_id" class="form-select" required>
                    <option value="">Select patient</option>
                    {% for p in patients %}
                    <option value="{{ p.id }}" {% if bill and bill.patient_id==p.id %}selected{% endif %}>{{ p.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-medium">Description</label>
            <textarea name="description" class="form-control" rows="2">{{ bill.description if bill else '' }}</textarea>
        </div>

        <div class="text-end">
            <button type="submit" class="btn btn-primary rounded-pill px-5">{% if bill %}Update{% else %}Save{% endif %} Record</button>
        </div>
    </form>
</div>

{% endblock %}
